  ci-status:
    name: CI Status
    if: always()
    needs: [test-linux, test-macos-arm, run-examples-linux, run-examples-macos-arm]
    runs-on: ubuntu-latest
    steps:
      - name: Check CI results
        run: |
          for result in "${{ needs.test-linux.result }}" "${{ needs.test-macos-arm.result }}" "${{ needs.run-examples-linux.result }}" "${{ needs.run-examples-macos-arm.result }}"; do
            if [ "$result" = "failure" ]; then
              echo "::error::CI failed – at least one job failed"
              exit 1
            fi
            if [ "$result" = "cancelled" ]; then
              echo "::error::CI cancelled – at least one job was cancelled"
              exit 1
            fi
          done
          echo "All CI jobs passed"
