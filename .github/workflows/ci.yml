  run-examples-linux:
    name: Run Examples (Linux x86_64)
    needs: test-linux
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: >-
        ZIG=zig
        CLANG=clang
        CLANGXX=clang++
        LLVM_LINK=llvm-link
    steps:
      - uses: actions/checkout@v4

      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          export ZVM_INSTALL="$HOME/.zvm/self"
          export PATH="$HOME/.zvm/bin:$ZVM_INSTALL:$PATH"
          zvm install ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}
          echo "$HOME/.zvm/bin" >> $GITHUB_PATH
          echo "$HOME/.zvm/self" >> $GITHUB_PATH

      - name: Install LLVM
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev clang-21 libclang-21-dev
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH

      - name: Build
        run: make build

      - name: Build FFI Examples (C/C++)
        run: make cpp

      - name: Run C++ FFI Analysis
        run: make cpp-run

      - name: Build Real-World FFI Examples
        run: make real-world

      - name: Run Real-World FFI Analysis
        run: make real-world-run

