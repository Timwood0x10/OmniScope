name: CI

on:
  push:
    branches: [master, main, improve]
  pull_request:
    branches: [master, main]

jobs:
  check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          zig-version: 0.15.0
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev
      - name: Type check
        run: zig build check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          zig-version: 0.15.0
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev
      - name: Run unit tests
        run: zig build unit-test --summary all

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          zig-version: 0.15.0
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev
      - name: Run integration tests
        run: zig build test-integration --summary all

  test-all:
    name: All Tests
    runs-on: ubuntu-latest
    needs: [test, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          zig-version: 0.15.0
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev
      - name: Run all tests
        run: |
          zig build unit-test --summary all
          zig build test-integration --summary all
          zig build test-issues --summary all
          zig build test-stability --summary all
          zig build test-stress --summary all

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          zig-version: 0.15.0
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev
      - name: Run benchmarks
        run: zig build bench-perf -Doptimize=ReleaseFast

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: test-all
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          zig-version: 0.15.0
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev
      - name: Build release
        run: zig build -Doptimize=ReleaseSafe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniscope-linux
          path: zig-out/bin/OmniScope

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: test-all
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          zig-version: 0.15.0
      - name: Install LLVM
        run: brew install llvm@18
      - name: Build release
        run: zig build -Doptimize=ReleaseSafe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniscope-macos
          path: zig-out/bin/OmniScope

  examples:
    name: FFI Examples
    runs-on: macos-latest
    needs: build-macos
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          zig-version: 0.15.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install LLVM
        run: brew install llvm@18
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: omniscope-macos
          path: zig-out/bin/
      - name: Make executable
        run: chmod +x zig-out/bin/OmniScope
      - name: Run Rust example
        run: make rust-run || true
      - name: Run C++ example
        run: make cpp-run || true
      - name: Run Zig example
        run: make zig-run || true

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: test-all
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          zig-version: 0.15.0
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev lcov
      - name: Generate coverage
        run: |
          zig build test -Dcoverage || true
          lcov --capture --directory . --output-file coverage.info || true
          lcov --remove coverage.info '/usr/*' --output-file coverage.info || true
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          fail_ci_if_error: false

  release-trigger:
    name: Trigger Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, examples]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - name: Trigger release workflow
        run: |
          echo "CI passed, triggering release workflow..."
          gh workflow run release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
