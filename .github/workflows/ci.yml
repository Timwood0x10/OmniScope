name: CI

on:
  push:
    branches: [master, improve, pd]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.15.2

jobs:

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          export ZVM_INSTALL="$HOME/.zvm/self"
          export PATH="$HOME/.zvm/bin:$ZVM_INSTALL:$PATH"
          zvm i ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}
          echo "$HOME/.zvm/bin" >> $GITHUB_PATH
          echo "$HOME/.zvm/self" >> $GITHUB_PATH

      - name: Install LLVM
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev clang-21 libclang-21-dev
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH

      - name: Lint & Format Check
        run: make fmt

      - name: Type Check
        run: make check

  test-linux:
    name: Test (Linux x86_64)
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: >-
        ZIG=zig
        CLANG=clang
        CLANGXX=clang++
        LLVM_LINK=llvm-link
    steps:
      - uses: actions/checkout@v4

      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          export ZVM_INSTALL="$HOME/.zvm/self"
          export PATH="$HOME/.zvm/bin:$ZVM_INSTALL:$PATH"
          zvm install ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}
          echo "$HOME/.zvm/bin" >> $GITHUB_PATH
          echo "$HOME/.zvm/self" >> $GITHUB_PATH

      - name: Install LLVM
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev clang-21 libclang-21-dev
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH

      - name: Build
        run: make build

      - name: Unit Tests
        run: make test-unit

      - name: Integration Tests
        run: make test-int

      - name: Issue Verification Tests
        run: make test-issues

      - name: Stability Tests
        run: make test-stability

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: OmniScope-linux-x86_64
          path: zig-out/bin/OmniScope
          retention-days: 5

  test-macos-arm:
    name: Test (macOS aarch64)
    needs: quality-gate
    runs-on: macos-latest
    env:
      MAKEFLAGS: >-
        ZIG=zig
        CLANG=clang
        CLANGXX=clang++
        LLVM_LINK=llvm-link
    steps:
      - uses: actions/checkout@v4

      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          export ZVM_INSTALL="$HOME/.zvm/self"
          export PATH="$HOME/.zvm/bin:$ZVM_INSTALL:$PATH"
          zvm install ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}
          echo "$HOME/.zvm/bin" >> $GITHUB_PATH
          echo "$HOME/.zvm/self" >> $GITHUB_PATH

      - name: Install LLVM
        run: brew install llvm@21 && echo "$(brew --prefix llvm@21)/bin" >> $GITHUB_PATH

      - name: Build
        run: make build

      - name: Unit Tests
        run: make test-unit

      - name: Integration Tests
        run: make test-int

      - name: Issue Verification Tests
        run: make test-issues

      - name: Stability Tests
        run: make test-stability

      - name: Upload macOS aarch64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: OmniScope-macos-aarch64
          path: zig-out/bin/OmniScope
          retention-days: 5

