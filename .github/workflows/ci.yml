name: CI

on:
  push:
    branches: [master, improve, dev]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ZIG_VERSION: 0.15.2

jobs:

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          export ZVM_INSTALL="$HOME/.zvm/self"
          export PATH="$HOME/.zvm/bin:$ZVM_INSTALL:$PATH"
          zvm i ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}
          echo "$HOME/.zvm/bin" >> $GITHUB_PATH
          echo "$HOME/.zvm/self" >> $GITHUB_PATH

      - name: Install LLVM
        run: |
          # Use LLVM 18 (stable on Ubuntu noble)
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18 libclang-18-dev
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH

      - name: Lint & Format Check
        run: make fmt

      - name: Type Check
        run: make check

  test-linux:
    name: Test (Linux x86_64)
    needs: quality-gate
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: >-
        ZIG=zig
        CLANG=clang
        CLANGXX=clang++
        LLVM_LINK=llvm-link
    steps:
      - uses: actions/checkout@v4

      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          export ZVM_INSTALL="$HOME/.zvm/self"
          export PATH="$HOME/.zvm/bin:$ZVM_INSTALL:$PATH"
          zvm install ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}
          echo "$HOME/.zvm/bin" >> $GITHUB_PATH
          echo "$HOME/.zvm/self" >> $GITHUB_PATH

      - name: Install LLVM
        run: |
          # Use LLVM 18 (stable on Ubuntu noble)
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev clang-18 libclang-18-dev
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH

      - name: Build
        run: make build

      - name: Unit Tests
        run: make test-unit

      - name: Integration Tests
        run: make test-int

      - name: Issue Verification Tests
        run: make test-issues

      - name: Stability Tests
        run: make test-stability

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: OmniScope-linux-x86_64
          path: zig-out/bin/OmniScope
          retention-days: 5

  test-macos-arm:
    name: Test (macOS aarch64)
    needs: quality-gate
    runs-on: macos-latest
    env:
      MAKEFLAGS: >-
        ZIG=zig
        CLANG=clang
        CLANGXX=clang++
        LLVM_LINK=llvm-link
    steps:
      - uses: actions/checkout@v4

      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          export ZVM_INSTALL="$HOME/.zvm/self"
          export PATH="$HOME/.zvm/bin:$ZVM_INSTALL:$PATH"
          zvm install ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}
          echo "$HOME/.zvm/bin" >> $GITHUB_PATH
          echo "$HOME/.zvm/self" >> $GITHUB_PATH

      - name: Install LLVM
        run: brew install llvm@22 && echo "$(brew --prefix llvm@22)/bin" >> $GITHUB_PATH

      - name: Build
        run: make build

      - name: Unit Tests
        run: make test-unit

      - name: Integration Tests
        run: make test-int

      - name: Issue Verification Tests
        run: make test-issues

      - name: Stability Tests
        run: make test-stability

      - name: Upload macOS aarch64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: OmniScope-macos-aarch64
          path: zig-out/bin/OmniScope
          retention-days: 5

