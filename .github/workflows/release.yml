name: Release

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: 0.15.2

jobs:

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: CI Status
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          running-workflow-name: CI Gate

  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    needs: ci-gate
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
          else
            VERSION=$(cat VERSION 2>/dev/null || echo "0.1.3")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

  build-linux-x86_64:
    name: Build (Linux x86_64)
    needs: [ci-gate, get-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          source /home/runner/.zvm/bin/zvm.zsh
          zvm install ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}

      - name: Install LLVM
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev clang-21 libclang-21-dev

      - name: Build Release
        run: |
          source /home/runner/.zvm/bin/zvm.zsh
          make build

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/OmniScope dist/OmniScope-${{ needs.get-version.outputs.version }}-linux-x86_64
          chmod +x dist/OmniScope-${{ needs.get-version.outputs.version }}-linux-x86_64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniScope-linux-x86_64
          path: dist/OmniScope-${{ needs.get-version.outputs.version }}-linux-x86_64
          retention-days: 1

  build-macos-aarch64:
    name: Build (macOS aarch64)
    needs: [ci-gate, get-version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          source $HOME/.zvm/bin/zvm.zsh
          zvm install ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}

      - name: Install LLVM
        run: brew install llvm@21

      - name: Build Release
        run: |
          source $HOME/.zvm/bin/zvm.zsh
          make build

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/OmniScope dist/OmniScope-${{ needs.get-version.outputs.version }}-macos-aarch64
          chmod +x dist/OmniScope-${{ needs.get-version.outputs.version }}-macos-aarch64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniScope-macos-aarch64
          path: dist/OmniScope-${{ needs.get-version.outputs.version }}-macos-aarch64
          retention-days: 1

  build-macos-x86_64:
    name: Build (macOS x86_64)
    needs: [ci-gate, get-version]
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          source $HOME/.zvm/bin/zvm.zsh
          zvm install ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}

      - name: Install LLVM
        run: brew install llvm@21

      - name: Build Release
        run: |
          source $HOME/.zvm/bin/zvm.zsh
          make build

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/OmniScope dist/OmniScope-${{ needs.get-version.outputs.version }}-macos-x86_64
          chmod +x dist/OmniScope-${{ needs.get-version.outputs.version }}-macos-x86_64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniScope-macos-x86_64
          path: dist/OmniScope-${{ needs.get-version.outputs.version }}-macos-x86_64
          retention-days: 1

  release:
    name: Create Release
    needs: [build-linux-x86_64, build-macos-aarch64, build-macos-x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read CHANGELOG
        id: changelog
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          CHANGELOG=$(awk "
            /^## .*\[.*${VERSION}.*\]/ { found=1; next }
            found && /^## .*\[/ { exit }
            found { print }
          " CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(cat CHANGELOG.md)
          fi
          echo "$CHANGELOG" > /tmp/release_body.md
          echo "Extracted changelog for v${VERSION}"

      - name: Download Linux x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: OmniScope-linux-x86_64
          path: dist

      - name: Download macOS aarch64 binary
        uses: actions/download-artifact@v4
        with:
          name: OmniScope-macos-aarch64
          path: dist

      - name: Download macOS x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: OmniScope-macos-x86_64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          name: OmniScope ${{ needs.get-version.outputs.tag }}
          body_path: /tmp/release_body.md
          draft: false
          prerelease: false
          files: |
            dist/OmniScope-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
