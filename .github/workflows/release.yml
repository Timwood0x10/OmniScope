name: Release

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: false

permissions:
  contents: write

env:
  ZIG_VERSION: 0.15.2

jobs:
  check-ci:
    name: Verify CI Status
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Check CI status
        run: |
          echo "Checking if CI passed for commit ${{ github.sha }}"
          gh run list --commit ${{ github.sha }} --workflow ci.yml --status success --limit 1 || {
            echo "CI has not passed for this commit"
            exit 1
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref#refs/tags/v }}"
          else
            VERSION=$(cat VERSION 2>/dev/null || echo "0.2.0")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
          echo "Tag: v$VERSION"

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: [get-version]
    steps:
      - uses: actions/checkout@v4
      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          export ZVM_INSTALL="$HOME/.zvm/self"
          export PATH="$HOME/.zvm/bin:$ZVM_INSTALL:$PATH"
          zvm install ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}
          echo "$HOME/.zvm/bin" >> $GITHUB_PATH
          echo "$HOME/.zvm/self" >> $GITHUB_PATH
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev
      - name: Build
        run: zig build -Doptimize=ReleaseFast
      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/OmniScope dist/omniscope-${{ needs.get-version.outputs.version }}-linux-x86_64
          cd dist
          tar -czvf omniscope-${{ needs.get-version.outputs.version }}-linux-x86_64.tar.gz omniscope-${{ needs.get-version.outputs.version }}-linux-x86_64
          rm omniscope-${{ needs.get-version.outputs.version }}-linux-x86_64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: dist/*.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [get-version]
    steps:
      - uses: actions/checkout@v4
      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          export ZVM_INSTALL="$HOME/.zvm/self"
          export PATH="$HOME/.zvm/bin:$ZVM_INSTALL:$PATH"
          zvm install ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}
          echo "$HOME/.zvm/bin" >> $GITHUB_PATH
          echo "$HOME/.zvm/self" >> $GITHUB_PATH
      - name: Install LLVM
        run: brew install llvm@18
      - name: Build
        run: zig build -Doptimize=ReleaseFast
      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/OmniScope dist/omniscope-${{ needs.get-version.outputs.version }}-macos-x86_64
          cd dist
          tar -czvf omniscope-${{ needs.get-version.outputs.version }}-macos-x86_64.tar.gz omniscope-${{ needs.get-version.outputs.version }}-macos-x86_64
          rm omniscope-${{ needs.get-version.outputs.version }}-macos-x86_64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-binary
          path: dist/*.tar.gz

  build-macos-arm:
    name: Build macOS ARM
    runs-on: macos-latest
    needs: [get-version]
    steps:
      - uses: actions/checkout@v4
      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          export ZVM_INSTALL="$HOME/.zvm/self"
          export PATH="$HOME/.zvm/bin:$ZVM_INSTALL:$PATH"
          zvm install ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}
          echo "$HOME/.zvm/bin" >> $GITHUB_PATH
          echo "$HOME/.zvm/self" >> $GITHUB_PATH
      - name: Install LLVM
        run: brew install llvm@18
      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=aarch64-macos
      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/OmniScope dist/omniscope-${{ needs.get-version.outputs.version }}-macos-aarch64
          cd dist
          tar -czvf omniscope-${{ needs.get-version.outputs.version }}-macos-aarch64.tar.gz omniscope-${{ needs.get-version.outputs.version }}-macos-aarch64
          rm omniscope-${{ needs.get-version.outputs.version }}-macos-aarch64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm-binary
          path: dist/*.tar.gz

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: [get-version]
    outputs:
      changelog: ${{ steps.extract.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog for version
        id: extract
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          CHANGELOG_FILE="CHANGELOG.md"
          
          if [ -f "$CHANGELOG_FILE" ]; then
            CHANGELOG=$(sed -n "/## \[$VERSION\]/,/## \[/p" "$CHANGELOG_FILE" | head -n -1 | tail -n +2)
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="Release version $VERSION\n\nSee CHANGELOG.md for details."
            fi
          else
            CHANGELOG="Release version $VERSION"
          fi
          
          {
            echo 'changelog<<EOF'
            echo "$CHANGELOG"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [get-version, build-linux, build-macos, build-macos-arm, generate-changelog]
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find dist -name "*.tar.gz" -exec cp {} release-assets/ \;
          ls -la release-assets/
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum *.tar.gz > checksums.sha256
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.get-version.outputs.tag }}
          name: OmniScope ${{ needs.get-version.outputs.tag }}
          body: |
            ## OmniScope ${{ needs.get-version.outputs.version }}
            
            ${{ needs.generate-changelog.outputs.changelog }}
            
            ## Downloads
            
            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Linux | x86_64 | `omniscope-${{ needs.get-version.outputs.version }}-linux-x86_64.tar.gz` |
            | macOS | x86_64 | `omniscope-${{ needs.get-version.outputs.version }}-macos-x86_64.tar.gz` |
            | macOS | aarch64 | `omniscope-${{ needs.get-version.outputs.version }}-macos-aarch64.tar.gz` |
            
            ## Requirements
            
            - LLVM 18+ (22 recommended for macOS)
            - Zig 0.15.0+
            
            ## Installation
            
            ```bash
            # Download and extract
            tar -xzf omniscope-${{ needs.get-version.outputs.version }}-<platform>-<arch>.tar.gz
            
            # Run
            ./OmniScope --help
            ```
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(needs.get-version.outputs.version, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
