  release:
    name: Create Release
    needs: [build-linux-x86_64, build-macos-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Read CHANGELOG
        id: changelog
        run: |
          VERSION=$(cat VERSION)
          CHANGELOG=$(awk "
            /^## .*\[.*${VERSION}.*\]/ { found=1; next }
            found && /^## .*\[/ { exit }
            found { print }
          " CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(cat CHANGELOG.md)
          fi
          echo "$CHANGELOG" > /tmp/release_body.md
          echo "Extracted changelog for v${VERSION}"

      - name: Download Linux x86_64 binary
        uses: actions/download-artifact@v4
        with:
          name: OmniScope-linux-x86_64
          path: dist

      - name: Download macOS aarch64 binary
        uses: actions/download-artifact@v4
        with:
          name: OmniScope-macos-aarch64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: OmniScope ${{ steps.version.outputs.tag }}
          body_path: /tmp/release_body.md
          draft: false
          prerelease: false
          files: |
            dist/OmniScope-linux-x86_64
            dist/OmniScope-macos-aarch64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
