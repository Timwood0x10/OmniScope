name: Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  ZIG_VERSION: 0.15.2

jobs:

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.sha }}
          check-name: CI Status
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          running-workflow-name: CI Gate

  build-linux-x86_64:
    name: Build (Linux x86_64)
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          export ZVM_INSTALL="$HOME/.zvm/self"
          export PATH="$HOME/.zvm/bin:$ZVM_INSTALL:$PATH"
          zvm i ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}
          echo "$HOME/.zvm/bin" >> $GITHUB_PATH
          echo "$HOME/.zvm/self" >> $GITHUB_PATH

      - name: Install LLVM
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21-dev clang-21 libclang-21-dev
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH

      - name: Build Release
        run: make build

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/OmniScope dist/OmniScope-linux-x86_64
          chmod +x dist/OmniScope-linux-x86_64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniScope-linux-x86_64
          path: dist/OmniScope-linux-x86_64
          retention-days: 1

  build-macos-aarch64:
    name: Build (macOS aarch64)
    needs: ci-gate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ZVM and Zig
        run: |
          curl -sSL https://www.zvm.app/install.sh | bash
          export ZVM_INSTALL="$HOME/.zvm/self"
          export PATH="$HOME/.zvm/bin:$ZVM_INSTALL:$PATH"
          zvm install ${{ env.ZIG_VERSION }}
          zvm use ${{ env.ZIG_VERSION }}
          echo "$HOME/.zvm/bin" >> $GITHUB_PATH
          echo "$HOME/.zvm/self" >> $GITHUB_PATH

      - name: Install LLVM
        run: brew install llvm@21 && echo "$(brew --prefix llvm@21)/bin" >> $GITHUB_PATH

      - name: Build Release
        run: make build

      - name: Package
        run: |
          mkdir -p dist
          cp zig-out/bin/OmniScope dist/OmniScope-macos-aarch64
          chmod +x dist/OmniScope-macos-aarch64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniScope-macos-aarch64
          path: dist/OmniScope-macos-aarch64
          retention-days: 1

