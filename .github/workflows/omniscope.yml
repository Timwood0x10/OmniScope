name: OmniScope Security Analysis

on:
  push:
    branches: [master, dev, improve]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [master]
  workflow_dispatch:  # Manual trigger for on-demand analysis

concurrency:
  group: omniscope-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.15.2"
  LLVM_VERSION: "22"

jobs:
  # Job 1: Build and Test
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig via zvm
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: |
            # Install zvm (Zig Version Manager)
            if ! command -v zvm &> /dev/null; then
              echo "Installing zvm..."
              curl -fsSL https://raw.githubusercontent.com/tristanisham/zvm/master/install.sh | bash
              echo "$HOME/.zvm/bin" >> $GITHUB_PATH
            fi
            
            # Install requested Zig version via zvm
            echo "Installing Zig ${{ env.ZIG_VERSION }} via zvm..."
            zvm install ${{ env.ZIG_VERSION }}
            zvm use ${{ env.ZIG_VERSION }}
            
            # Verify installation
            zig version

      - name: Cache Zig build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-cache
            zig-out
          key: omniscope-build-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-${{ hashFiles('**/*.zig', 'build.zig') }}
          restore-keys: |
            omniscope-build-${{ runner.os }}-zig${{ env.ZIG_VERSION }}-

      - name: Build (Debug)
        run: zig build -Ddebug-safe

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Run tests
        run: zig build test 2>&1 | tee test-output.txt

      - name: Check test results
        run: |
          if grep -q "343/343" test-output.txt; then
            echo "✅ All tests passed!"
          else
            echo "❌ Some tests failed"
            cat test-output.txt
            exit 1
          fi

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omniscope-binaries
          path: |
            zig-out/bin/OmniScope
          retention-days: 7

  # Job 2: Analyze Corpus Files
  analyze-corpus:
    name: Analyze Corpus (${{ matrix.build_mode }})
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        build_mode: [debug, release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig via zvm
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: |
            if ! command -v zvm &> /dev/null; then
              curl -fsSL https://raw.githubusercontent.com/tristanisham/zvm/master/install.sh | bash
              echo "$HOME/.zvm/bin" >> $GITHUB_PATH
            fi
            zvm install ${{ env.ZIG_VERSION }}
            zvm use ${{ env.ZIG_VERSION }}
            zig version

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-${{ env.LLVM_VERSION }} clang-${{ env.LLVM_VERSION }}

      - name: Build OmniScope
        if: matrix.build_mode == 'release'
        run: zig build -Doptimize=ReleaseFast
      
      - name: Build OmniScope
        if: matrix.build_mode == 'debug'
        run: zig build -Ddebug-safe

      - name: Create output directory
        run: mkdir -p outputs/corpus-analysis

      - name: Run corpus analysis
        run: |
          LLVM_AS="llvm-as-${{ env.LLVM_VERSION }}"
          
          TOTAL=0
          SUCCESS=0
          FAIL=0
          TOTAL_ISSUES=0
          TOTAL_FUNCS=0
          
          for ll in $(find corpus/ -name "*.ll" -type f | sort); do
            name=$(basename "$ll" .ll)
            
            # Handle .bc files misnamed as .ll
            if file "$ll" | grep -q "LLVM bitcode"; then
              bcfile="/tmp/${name}.bc"
              cp "$ll" "$bcfile"
            else
              bcfile="/tmp/${name}.bc"
              "$LLVM_AS" "$ll" -o "$bcfile" 2>/dev/null || continue
            fi
            
            TOTAL=$((TOTAL + 1))
            
            result=$(./zig-out/bin/OmniScope "$bcfile" --json 2>/dev/null)
            rc=$?
            
            if [ $rc -eq 0 ]; then
              echo "$result" > "outputs/corpus-analysis/${name}.json"
              
              funcs=$(echo "$result" | grep -o '"functions":[0-9]*' | grep -o '[0-9]*')
              issues=$(echo "$result" | grep -o '"issues":[0-9]*' | grep -o '[0-9]*')
              
              printf "[OK] %-30s funcs=%-6s issues=%s\n" "$name" "${funcs:-0}" "${issues:-0}"
              
              SUCCESS=$((SUCCESS + 1))
              TOTAL_FUNCS=$((TOTAL_FUNCS + ${funcs:-0}))
              TOTAL_ISSUES=$((TOTAL_ISSUES + ${issues:-0}))
            else
              echo "[FAIL] $name (exit=$rc)"
              FAIL=$((FAIL + 1))
            fi
            
            rm -f "$bcfile"
          done
          
          echo ""
          echo "========================================="
          echo "  Corpus Analysis Summary (${{ matrix.build_mode }})"
          echo "========================================="
          echo "  Total files:     $TOTAL"
          echo "  ✅ Success:       $SUCCESS"
          echo "  ❌ Failed:        $FAIL"
          echo "  📊 Functions:     $TOTAL_FUNCS"
          echo "  🐛 Issues:        $TOTAL_ISSUES"
          echo "  Success Rate:    $(( SUCCESS * 100 / TOTAL ))%"
          echo "========================================="

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-results-${{ matrix.build_mode }}
          path: outputs/corpus-analysis/
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          echo "## 🔍 OmniScope Corpus Analysis Results (${{ matrix.build_mode }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Files** | $TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "| **Success** | ✅ $SUCCESS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Failed** | ❌ $FAIL |" >> $GITHUB_STEP_SUMMARY
          echo "| **Functions** | $TOTAL_FUNCS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Issues Found** | 🐛 $TOTAL_ISSUES |" >> $GITHUB_STEP_SUMMARY
          echo "| **Success Rate** | $(( SUCCESS * 100 / TOTAL ))% |" >> $GITHUB_STEP_SUMMARY

  # Job 3: Generate SARIF for GitHub Code Scanning
  sarif-upload:
    name: SARIF Report
    runs-on: ubuntu-latest
    needs: analyze-corpus
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: corpus-results-release
          path: sarif-input/

      - name: Merge JSON to SARIF
        run: |
          python3 << 'EOF'
          import json
          import os
          from datetime import datetime
          
          sarif = {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [{
              "tool": {
                "driver": {
                  "name": "OmniScope",
                  "version": "0.1.7",
                  "informationUri": "https://github.com/your-org/OmniScope",
                  "rules": []
                }
              },
              "results": [],
              "invocations": [{
                "executionSuccessful": True,
                "endTimeUtc": datetime.utcnow().isoformat()
              }]
            }]
          }
          
          rule_ids = set()
          
          for json_file in os.listdir("sarif-input/"):
            if not json_file.endswith(".json"):
              continue
              
            try:
              with open(f"sarif-input/{json_file}") as f:
                data = json.load(f)
                
                for issue in data.get("issues", []):
                  result = {
                    "ruleId": issue.get("kind", "unknown"),
                    "level": _to_sarif_level(issue.get("severity", "medium")),
                    "message": {
                      "text": issue.get("message", "")
                    },
                    "locations": [{
                      "physicalLocation": {
                        "artifactLocation": {
                          "uri": json_file
                        },
                        "region": {}
                      }
                    }],
                    "properties": {
                      "confidence": issue.get("confidence_score", 0),
                      "cwe_id": issue.get("cwe_id", 0),
                      "function": issue.get("location", {}).get("function", "")
                    }
                  }
                  
                  sarif["runs"][0]["results"].append(result)
                  
                  kind = issue.get("kind", "unknown")
                  if kind not in rule_ids:
                    rule_ids.add(kind)
                    sarif["runs"][0]["tool"]["driver"]["rules"].append({
                      "id": kind,
                      "name": kind,
                      "shortDescription": {"text": kind}
                    })
                    
            except Exception as e:
              print(f"Error processing {json_file}: {e}")
          
          with open("omniscope-results.sarif", "w") as f:
            json.dump(sarif, f, indent=2)
          
          print(f"Generated SARIF with {len(sarif['runs'][0]['results'])} findings")
          
          def _to_sarif_level(severity):
            mapping = {"critical": "error", "high": "error", "medium": "warning", "low": "note"}
            return mapping.get(severity.lower(), "warning")
          EOF

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: omniscope-results.sarif
        continue-on-error: true

  # Job 4: Performance Benchmark
  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Zig via zvm
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: |
            if ! command -v zvm &> /dev/null; then
              curl -fsSL https://raw.githubusercontent.com/tristanisham/zvm/master/install.sh | bash
              echo "$HOME/.zvm/bin" >> $GITHUB_PATH
            fi
            zvm install ${{ env.ZIG_VERSION }}
            zvm use ${{ env.ZIG_VERSION }}
            zig version

      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-${{ env.LLVM_VERSION }} time

      - name: Build ReleaseFast
        run: zig build -Doptimize=ReleaseFast

      - name: Run performance benchmark
        run: |
          echo "# ⚡ OmniScope v0.1.7 Performance Benchmark" > benchmark.md
          echo "" >> benchmark.md
          echo "| File | Functions | Issues | Time (ms) | FFI Bounds |" >> benchmark.md
          echo "|------|-----------|--------|-----------|------------|" >> benchmark.md
          
          LLVM_AS="llvm-as-${{ env.LLVM_VERSION }}"
          
          for ll in $(find corpus/real_world -name "*.ll" -type f | head -10); do
            name=$(basename "$ll" .ll)
            
            if file "$ll" | grep -q "LLVM bitcode"; then
              bcfile="/tmp/${name}.bc"
              cp "$ll" "$bcfile"
            else
              bcfile="/tmp/${name}.bc"
              "$LLVM_AS" "$ll" -o "$bcfile" 2>/dev/null || continue
            fi
            
            # Measure time
            START=$(date +%s%N)
            result=$(./zig-out/bin/OmniScope "$bcfile" --json 2>/dev/null)
            END=$(date +%s%N)
            MS=$(( (END - START) / 1000000 ))
            
            funcs=$(echo "$result" | grep -o '"functions":[0-9]*' | grep -o '[0-9]*' || echo "0")
            issues=$(echo "$result" | grep -o '"issues":[0-9]*' | grep -o '[0-9]*' || echo "0")
            ffi=$(echo "$result" | grep -o 'found .* FFI' | grep -o '[0-9]*' || echo "0")
            
            printf "| %s | %s | %s | %sms | %s |\n" "$name" "$funcs" "$issues" "$MS" "$ffi" >> benchmark.md
            
            rm -f "$bcfile"
          done
          
          echo "" >> benchmark.md
          echo "*Benchmark date: $(date)*" >> benchmark.md
          echo "*Build mode: ReleaseFast*" >> benchmark.md
          echo "*LLVM version: ${{ env.LLVM_VERSION }}*" >> benchmark.md

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: performance-benchmark
          path: benchmark.md

# Comment on PR with summary
pr_comment:
    name: PR Comment
    runs-on: ubuntu-latest
    needs: [analyze-corpus, sarif-upload]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: corpus-results-release
          path: pr-results/

      - name: Generate comment body
        run: |
          TOTAL_ISSUES=0
          TOTAL_FUNCS=0
          SUCCESS=0
          TOTAL=0
          
          for f in pr-results/*.json; do
            TOTAL=$((TOTAL + 1))
            if [ -f "$f" ]; then
              SUCCESS=$((SUCCESS + 1))
              ISSUES=$(grep -o '"issues":[0-9]*' "$f" | grep -o '[0-9]*')
              FUNCS=$(grep -o '"functions":[0-9]*' "$f" | grep -o '[0-9]*')
              TOTAL_ISSUES=$((TOTAL_ISSUES + ISSUES))
              TOTAL_FUNCS=$((TOTAL_FUNCS + FUNCS))
            fi
          done
          
          cat > pr_comment.md << EOF
          ## 🔍 OmniScope Security Analysis Report
          
          ### Summary
          | Metric | Value |
          |--------|-------|
          | **Files Analyzed** | $TOTAL |
          | **Success Rate** | ✅ $(( SUCCESS * 100 / TOTAL ))% |
          | **Total Functions** | $TOTAL_FUNCS |
          | **Issues Found** | 🐛 $TOTAL_ISSUES |
          
          ### Details
          - Analysis engine: OmniScope v0.1.7 (ReleaseFast)
          - LLVM version: ${{ env.LLVM_VERSION }}
          - Full SARIF report uploaded to Code Scanning tab ↗️
          
          ---
          *Generated by [OmniScope](https://github.com/your-org/OmniScope) CI workflow*
          EOF

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('pr_comment.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
